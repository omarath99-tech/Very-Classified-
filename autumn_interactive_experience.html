<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف سري جداً 🍂</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        autumn: {
                            dark: '#361D10',
                            brown: '#4A2E16',
                            orange: '#D96B27',
                            rust: '#B84A17',
                            gold: '#D4AF37',
                            beige: '#F5EBE0',
                            cream: '#FAF0E6'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #2D180C 0%, #4A2E16 40%, #7C3615 70%, #361D10 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Falling Leaves */
        .leaf {
            position: fixed;
            top: -10%;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 0.9;
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(50px);
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-30px);
                opacity: 0.2;
            }
        }

        /* Secret Stamp Pulse & Style */
        .stamp-box {
            border: 4px dashed #D4AF37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.2);
            animation: stampPulse 3s infinite alternate;
        }

        @keyframes stampPulse {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.03) rotate(2deg); filter: drop-shadow(0 0 12px #D4AF37); }
        }

        /* Escape Button Smooth Shake & Dodge */
        .escaping-btn {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px -5px rgba(217, 107, 39, 0.5), 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .shake-element {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-3deg); }
            40%, 80% { transform: translateX(10px) rotate(3deg); }
        }

        /* Glow Text for Final Reveal */
        .glow-text {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8), 0 0 40px rgba(217, 107, 39, 0.6), 0 0 60px rgba(212, 175, 55, 0.4);
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            from {
                text-shadow: 0 0 15px rgba(212, 175, 55, 0.7), 0 0 30px rgba(217, 107, 39, 0.5);
                transform: scale(1);
            }
            to {
                text-shadow: 0 0 30px rgba(212, 175, 55, 1), 0 0 50px rgba(217, 107, 39, 0.9), 0 0 70px rgba(212, 175, 55, 0.8);
                transform: scale(1.04);
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-autumn-beige">

    <!-- Container for falling leaves background -->
    <div id="leaves-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Floating Playful Toast Notification -->
    <div id="toast" class="fixed top-6 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 bg-autumn-brown/90 border-2 border-autumn-gold text-autumn-beige px-6 py-3 rounded-full shadow-2xl backdrop-blur-md flex items-center gap-3 text-sm md:text-base font-bold">
        <i class="fa-solid fa-face-laugh-wink text-autumn-gold text-xl"></i>
        <span id="toast-message">حاولي تمسكيني! 😉</span>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full max-w-xl mx-auto text-center">

        <!-- FIRST INTERACTIVE STAGE -->
        <div id="stage-1" class="transition-all duration-700 ease-out transform opacity-100 scale-100 flex flex-col items-center justify-center gap-8 py-8 px-4">
            
            <!-- Top Secret Stamp -->
            <div class="stamp-box bg-autumn-dark/80 backdrop-blur-md px-8 py-4 rounded-2xl transform -rotate-2 select-none">
                <span class="text-3xl md:text-5xl font-black text-autumn-gold tracking-widest font-cairo">
                    🔒 سري جداً 🔒
                </span>
            </div>

            <!-- Classified Info Subtitles -->
            <div class="space-y-3 select-none">
                <p class="text-xl md:text-2xl font-mono tracking-wide text-autumn-gold/90 font-semibold italic">
                    very classified by Mari
                </p>
                <div class="inline-flex items-center gap-2 bg-autumn-rust/30 border border-autumn-rust/60 px-5 py-2 rounded-full backdrop-blur-sm">
                    <span class="text-lg md:text-xl font-bold text-autumn-beige">لا تعبر الحدود 🚫</span>
                </div>
            </div>

            <!-- Interactive Escaping Button Container -->
            <div id="btn-wrapper" class="relative w-full h-36 flex items-center justify-center mt-4">
                <button id="escape-btn" class="escaping-btn absolute bg-gradient-to-r from-autumn-orange to-autumn-rust hover:from-autumn-rust hover:to-autumn-orange text-autumn-beige font-cairo font-bold text-xl md:text-2xl px-10 py-4 rounded-full border-2 border-autumn-gold cursor-pointer transform active:scale-95 shadow-xl flex items-center gap-3">
                    <i class="fa-solid fa-folder-closed text-autumn-gold"></i>
                    <span>افتحي الملف؟</span>
                </button>
            </div>

            <!-- Helpful hint footer -->
            <p id="sub-hint" class="text-xs md:text-sm text-autumn-gold/60 mt-4 animate-pulse">
                ( اضغطي على الزر إذا استطعتِ الوصول إليه! 🍂 )
            </p>
        </div>

        <!-- FINAL REVEAL STAGE (Hidden by default) -->
        <div id="stage-2" class="hidden opacity-0 scale-90 transition-all duration-1000 ease-out flex flex-col items-center justify-center min-h-[60vh]">
            <div class="bg-autumn-dark/60 backdrop-blur-lg border-2 border-autumn-gold/50 rounded-3xl p-10 md:p-16 shadow-2xl relative overflow-hidden">
                <!-- Decorative Corner Leaves -->
                <div class="absolute -top-4 -left-4 text-autumn-gold/30 text-4xl transform rotate-45"><i class="fa-solid fa-leaf"></i></div>
                <div class="absolute -bottom-4 -right-4 text-autumn-gold/30 text-4xl transform -rotate-45"><i class="fa-solid fa-leaf"></i></div>
                
                <!-- THE ONLY REQUIRED WORD -->
                <h1 class="glow-text font-cairo font-black text-6xl md:text-9xl text-autumn-gold tracking-wider my-4">
                    اشونكي؟
                </h1>
            </div>
        </div>

    </main>

    <script>
        // DOM Elements
        const escapeBtn = document.getElementById('escape-btn');
        const btnWrapper = document.getElementById('btn-wrapper');
        const stage1 = document.getElementById('stage-1');
        const stage2 = document.getElementById('stage-2');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        const leavesContainer = document.getElementById('leaves-container');

        // Escape Tracker Counter
        let escapeCount = 0;
        const maxEscapes = 3;

        // Playful messages in feminine form during escape attempts
        const escapeMessages = [
            "أوه! سريعة جداً، حاولي مجدداً! 😜",
            "يا شاطرة... ليس بهذه السهولة! 🍂",
            "خلاص هذه آخر مرة، ودمكِ عسل! 💛"
        ];

        // Leaf icons array for variety
        const leafIcons = ['fa-leaf', 'fa-seedling', 'fa-plant-wilt'];

        // Function to create falling autumn leaves animation
        function createAutumnLeaves() {
            const numberOfLeaves = 25;
            for (let i = 0; i < numberOfLeaves; i++) {
                const leaf = document.createElement('i');
                const randomIcon = leafIcons[Math.floor(Math.random() * leafIcons.length)];
                
                leaf.className = `fa-solid ${randomIcon} leaf`;
                
                // Random position & styling for realism
                const startLeft = Math.random() * 100;
                const size = Math.random() * 20 + 14; // Size between 14px and 34px
                const duration = Math.random() * 8 + 6; // Duration 6s to 14s
                const delay = Math.random() * 8;
                
                // Autumn Palette Colors
                const colors = ['#D96B27', '#B84A17', '#D4AF37', '#8C3B18', '#A65319'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                leaf.style.left = `${startLeft}vw`;
                leaf.style.fontSize = `${size}px`;
                leaf.style.color = randomColor;
                leaf.style.animationDuration = `${duration}s`;
                leaf.style.animationDelay = `${delay}s`;

                leavesContainer.appendChild(leaf);
            }
        }

        // Show playful toast notification
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2200);
        }

        // Handle button dodge / escape logic
        function dodgeButton() {
            if (escapeCount < maxEscapes) {
                escapeCount++;

                // Trigger message
                showToast(escapeMessages[escapeCount - 1]);

                // Calculate random translate bounds within screen / container
                const wrapperRect = btnWrapper.getBoundingClientRect();
                const btnRect = escapeBtn.getBoundingClientRect();

                // Generate offset within safe range
                const maxX = Math.min(window.innerWidth / 2 - 100, 160);
                const maxY = 90;

                let randomX = (Math.random() - 0.5) * maxX * 2;
                let randomY = (Math.random() - 0.5) * maxY * 2;

                // Ensure it moves noticeably from center
                if (Math.abs(randomX) < 40) randomX = randomX < 0 ? -80 : 80;
                if (Math.abs(randomY) < 30) randomY = randomY < 0 ? -50 : 50;

                escapeBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${1 - escapeCount * 0.05})`;
                
                // Add shake feedback
                stage1.classList.add('shake-element');
                setTimeout(() => stage1.classList.remove('shake-element'), 400);

                if (escapeCount === maxEscapes) {
                    // Update button UI on final ready state
                    setTimeout(() => {
                        escapeBtn.style.transform = 'translate(0px, 0px) scale(1.05)';
                        escapeBtn.classList.remove('from-autumn-orange', 'to-autumn-rust');
                        escapeBtn.classList.add('from-autumn-gold', 'to-autumn-orange', 'ring-4', 'ring-autumn-gold/50');
                        escapeBtn.querySelector('span').textContent = 'افتحي الملف الآن! ✨';
                    }, 600);
                }
            }
        }

        // Transition to Final Stage
        function revealFinalStage() {
            // Smoothly fade out Stage 1
            stage1.classList.remove('opacity-100', 'scale-100');
            stage1.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                stage1.classList.add('hidden');
                stage2.classList.remove('hidden');
                
                // Smoothly fade in Stage 2
                setTimeout(() => {
                    stage2.classList.remove('opacity-0', 'scale-90');
                    stage2.classList.add('opacity-100', 'scale-100');
                }, 50);
            }, 700);
        }

        // Event Listeners for Escape Behavior (Hover & Touch)
        escapeBtn.addEventListener('mouseenter', () => {
            if (escapeCount < maxEscapes) {
                dodgeButton();
            }
        });

        escapeBtn.addEventListener('touchstart', (e) => {
            if (escapeCount < maxEscapes) {
                e.preventDefault(); // Prevent accidental click on mobile touch
                dodgeButton();
            }
        }, { passive: false });

        // Click Event (Triggers dodge if < 3, otherwise opens final stage)
        escapeBtn.addEventListener('click', (e) => {
            if (escapeCount < maxEscapes) {
                dodgeButton();
            } else {
                revealFinalStage();
            }
        });

        // Initialize background leaves on window load
        window.onload = function() {
            createAutumnLeaves();
        };
    </script>
</body>
</html>
